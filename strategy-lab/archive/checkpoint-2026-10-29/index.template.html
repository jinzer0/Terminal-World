<script id="research-data" type="application/json">__RESEARCH_DATA__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('research-data').textContent);
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sources=new Map(D.sources.map((s,i)=>[s.id,{...s,n:i+1}]));
const refs=ids=>`<div class="refs">${(ids||[]).map(id=>{const s=sources.get(id);return `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer" title="${esc(s.title)}">↗ ${String(s.n).padStart(2,'0')} · ${esc(s.title)}</a>`}).join('')}</div>`;
const list=items=>`<ul>${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
const facts=pairs=>`<dl class="facts">${pairs.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>`;
const detail=(title,body,wide=false)=>`<details${wide?' class="wide-details"':''}><summary>${esc(title)}</summary><div class="details-body">${body}</div></details>`;
const head=(n,en,title,desc)=>`<div class="section-top"><div class="intro"><div class="eyebrow">${esc(en)}</div><h2>${esc(title)}</h2><p>${esc(desc)}</p></div><span class="section-no">${String(n).padStart(2,'0')}</span></div>`;
const section=(id,body,cls='')=>`<section class="section ${cls}" id="${id}" aria-label="${id}">${body}</section>`;
const navItems=[['hero','Overview'],['health','Product health'],['why','Why use this?'],['competitors','Competitor showdown'],['targets','Who is it for?'],['ideas','Idea explorer'],['concepts','Top 3 concepts'],['decision','Decision lab'],['new-world','The new Terminal World'],['roadmap','MVP roadmap'],['verdict','Final verdict'],['sources','Sources & evidence']];
$('#navigation').innerHTML=navItems.map(([id,t],i)=>`<a href="#${id}"${i===0?' aria-current="true"':''}><span>${String(i).padStart(2,'0')}</span>${t}</a>`).join('');
const featureAudit=D.features.map(f=>`<article class="card"><h3>${esc(f.name)}</h3><span class="badge b">${esc(f.decision)}</span><div style="margin-top:15px">${facts([['실제 문제',f.problem],['효용',f.value],['대체 가능성',f.substitute],['최초 접속',f.first],['반복 사용',f.repeat],['사람 수 의존',f.network],['구현·운영 비용',f.cost]])}</div></article>`).join('');
$('#content').innerHTML=
section('hero',`<div class="hero-top"><span class="badge"><span class="dot"></span> PRODUCT STRATEGY / 2026</span><span class="badge">공개 자료 기반 · 사용자 검증 전</span></div><div class="hero-layout"><div><h1>Does Terminal <br>World deserve <br>to <em>exist?</em></h1><p class="hero-lead">돌아올 공간보다,<br>돌아와서 이어 할 이유를.</p><p class="hero-desc">SSH 기반 개발자 커뮤니티라는 출발점에서 한 걸음 물러납니다. 사람들은 왜 처음 접속하고, 왜 내일 다시 돌아올까요?</p><div class="actions"><a class="button primary" href="#ideas">9개의 새 방향 탐색하기 ↗</a><a class="button" href="#decision">결론 직접 검토하기 ↓</a></div></div><div class="direction-card"><div class="path-label"><span>DIRECTION SHIFT</span><span>가설 · 검증 우선순위</span></div><div class="old-world"><span class="small">FROM / 사람이 있어야 작동하는 공간</span><div class="room-row"><span>Lobby</span><span>Focus</span><span>Cafe</span><span>Rooftop</span><span>Living</span></div></div><div class="pivot-arrow">↓</div><div class="new-world"><span class="eyebrow">RECOMMENDED / STRATEGY B</span><h3>Checkpoint<span style="color:var(--accentText)">_</span></h3><p class="muted small">개발을 멈출 때 다음 행동을 남기고,<br>돌아온 내가 바로 확인하는 로컬 도구.</p><div class="micro-flow"><div>중단 기록</div><span>→</span><div>맥락 확인</div><span>→</span><div>작업 재개</div></div></div><p class="small muted" style="margin:20px 0 0">혼자서 시작할 수 있습니다.<br>기존 메모보다 나은지는 아직 검증해야 합니다.</p></div></div><div class="hero-stats"><div><strong>${D.competitors.length}</strong><span>경쟁·대체 제품</span></div><div><strong>${D.ideas.length}</strong><span>새로운 방향</span></div><div><strong>${D.concepts.length}</strong><span>심층 후보</span></div><div><strong>${D.sources.length}</strong><span>근거 자료</span></div></div>${detail('현재 구현은 어디까지 확인했나?',`<p>${esc(D.meta.currentImplementation)}</p><p>소스 정적 확인이며 기존 앱 전체의 실행 검증은 아니다. 현재 기획과 구현을 분리해 평가했다.</p>`,true)}`,'hero')+
section('health',head(1,'Product Health Check','문제는 기능의 수가 아니다.','현재 기획의 사용 이유를 진단합니다. 1은 약함, 3은 중간, 5는 강함이며 모든 점수는 가설적 판단입니다.')+`<div class="grid three health-grid">${D.health.map(h=>`<article class="card health"><div class="card-top"><h3>${esc(h.name)}</h3><span class="score-number">${h.score}<small>/5</small></span></div><div class="bar" aria-hidden="true"><i style="width:${h.score*20}%"></i></div>${detail('근거와 개선 방향',`<p>${esc(h.reason)}</p><h4>바꿀 방향</h4><p>${esc(h.action)}</p>${refs(h.refs)}`)}</article>`).join('')}</div>${detail('현재 기능 10개, 무엇을 남기고 없앨까?',`<p>현재 기획을 평가한 분석 가설이다. 아래 모든 기능이 구현되었다는 뜻은 아니다.</p><div class="grid two">${featureAudit}</div>`,true)}`)+
section('why',head(2,'Why Would Anyone Use This?','사용자의 질문은 더 단순하다.','터미널을 좋아한다는 이유만으로 새로운 커뮤니티에 정착하지는 않습니다. 질문을 눌러 가장 강한 반론부터 살펴보세요.')+`<div class="grid two">${D.questions.map((q,i)=>`<article class="card"><span class="eyebrow">QUESTION 0${i+1}</span><h3 style="margin-top:15px">${esc(q.q)}</h3>${detail('답과 근거 보기',`<h4>${esc(q.answer)}</h4><p>${esc(q.reason)}</p>${refs(q.refs)}`)}</article>`).join('')}</div>`)+
section('competitors',head(3,'Competitor Showdown','이미 좋은 대안이 너무 많다.','기능은 공식 자료로 확인했습니다. 반복 동기·한계·공략할 공백은 그 자료에서 도출한 분석 가설입니다.')+`<div class="filters" id="competitor-filters" aria-label="경쟁 제품 유형"></div><p class="result-count" id="competitor-count" role="status"></p><div class="grid three" id="competitor-grid"></div><div class="note warm">작업 재개에도 Pieces·Mylyn·Taskbook·개인 메모라는 강한 대안이 있습니다. ‘터미널에서 된다’와 ‘혼자 쓸 수 있다’만으로는 충분한 차별점이 아닙니다.</div>`)+
section('targets',head(4,'Who Is It For?','모든 개발자를 위한 제품부터 시작하지 않는다.','한 사람이 혼자 얻는 효용을 먼저 검증합니다. 타깃 우선순위와 사용 동기는 인터뷰 전 가설입니다.')+`<div class="target-layout"><div class="target-list" id="target-list" aria-label="사용자군 선택"></div><article class="card" id="target-panel" aria-live="polite"></article></div>${detail('타깃 선정의 기준과 점수',`<p>문제 중요성 30 · 빈도 25 · 접근성 25 · 구현 가능성 20. 각 1~5점의 전문가 가설을 가중 평균한 값이다. 1은 낮음, 3은 중간, 5는 높음이다. 동아리는 집단 기능의 주고객보다 개인 사용자 모집 경로로 먼저 활용한다.</p><div class="table-wrap" tabindex="0" role="region" aria-label="사용자군 평가표"><table><thead><tr><th>사용자군</th><th>중요성</th><th>빈도</th><th>접근성</th><th>구현</th><th>가설 점수</th></tr></thead><tbody>${D.targets.map(t=>`<tr><td>${esc(t.name)}</td>${t.scores.map(s=>`<td>${s}</td>`).join('')}<td>${t.scores.reduce((a,s,i)=>a+s*[30,25,25,20][i],0)/5}</td></tr>`).join('')}</tbody></table></div>`,true)}`)+
section('ideas',head(5,'Idea Explorer','남길 것인가. 바꿀 것인가. 새로 시작할 것인가.','커뮤니티 유지부터 전면 재설계까지, 서로 다른 문제를 푸는 9개 콘셉트입니다. 최대 3개를 골라 나란히 비교하세요.')+`<div class="filters" id="idea-filters" aria-label="아이디어 전략"></div><p class="result-count" id="idea-count" role="status"></p><div class="grid three" id="idea-grid"></div><div class="compare-area" id="idea-compare"><div class="compare-title"><h3>나의 비교 후보 <span class="muted" id="compare-count">0 / 3</span></h3><button class="button" id="clear-compare" type="button">선택 지우기</button></div><div id="compare-grid"></div></div><div class="note">상위 후보는 단독 효용, 반복 과업, 접근 가능한 모집 단위, 학기 안의 구현 범위로 선별했습니다. 각 아이디어의 ‘선별 판단’에서 선정·보류 이유를 확인할 수 있습니다.</div>`)+
section('concepts',head(6,'Top 3 Concepts','선택지에서, 실제 제품의 형태로.','가장 먼저 검증할 세 가지 방향을 Mini PRD로 구체화했습니다. 화면 예시는 제안 UX이며 구현된 앱이 아닙니다.')+`<div class="tabs" id="concept-tabs" role="tablist" aria-label="상위 후보"></div><div id="concept-panel" role="tabpanel" tabindex="0"></div>`)+
section('decision',head(7,'Decision Lab','당신의 우선순위라면, 결론이 달라질까?','기본 추천은 Checkpoint입니다. 그러나 4점 차이는 강한 우위가 아닙니다. 가중치를 바꿔 결론의 민감도를 직접 확인하세요.')+`<div class="note">모든 점수·가중치는 분석적 판단을 정량화한 가설입니다. 시장 성공 확률이나 실제 사용 데이터가 아닙니다. 1 = 낮음 · 3 = 중간 · 5 = 높음.</div><div class="mobile-scorebar" id="mobile-scores" aria-label="현재 가중치별 점수"></div><div class="decision-layout"><div class="card"><div class="card-top"><h3>무엇이 더 중요한가</h3><span class="badge">0–30</span></div><div id="weights"></div><div class="weight-summary" id="weight-summary"></div><button class="button" id="reset-weights" type="button" style="width:100%;margin-top:16px">기본 가중치로 되돌리기 ↺</button></div><div><p class="eyebrow">LIVE WEIGHTED SCORE / 100</p><p id="ranking-status" role="status" aria-live="polite"></p><div id="ranking"></div><div class="note warm">기본 가중치에서 구현 가능성 10을 0으로 내리면 Checkpoint와 Unblock Desk는 72.22점으로 동률입니다. 추천은 가정에 민감합니다.</div></div></div>${detail('기준별 점수와 모든 판단 근거',`<p>종합점수 = 100 × Σ(가중치 × 점수) ÷ (5 × 가중치 합). 합계가 0이면 계산하지 않는다. UI는 소수 둘째 자리까지 표시하며 순위는 반올림 전 값으로 정한다.</p><div class="table-wrap" tabindex="0" role="region" aria-label="후보별 평가 점수와 근거"><table><thead><tr><th>기준</th>${D.concepts.map(c=>`<th>${esc(c.name)}</th>`).join('')}</tr></thead><tbody>${D.criteria.map((r,i)=>`<tr><th>${esc(r.label)}<p class="small muted">${esc(r.description)}</p></th>${D.concepts.map(c=>`<td><strong>${c.scores[i]} / 5</strong><p>${esc(c.rationale[i])}</p></td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="table-note">좁은 화면에서는 이 표 영역만 좌우로 이동할 수 있습니다.</p>`,true)}${detail('왜 이 기본 가중치를 골랐나?',`<p>문제 중요성과 반복 가능성에 각각 20을 두어 핵심 효용을 우선했다. 차별성 15는 기존 대안에서 바꿀 이유다. 최초 사용·모집·구현·졸업 적합성에 각 10을 두어 현실 제약을 반영했다. 확장은 5로 두어 먼 성장보다 당장의 검증을 우선한다.</p><p>가중치뿐 아니라 원점수도 불확실하다. Checkpoint의 차별성 점수를 2에서 3으로 바꾸는 것만으로 기본 총점이 3점 달라진다.</p>`,true)}`)+
section('new-world',head(8,'The New Terminal World','내일의 나에게, 다음 한 걸음을.','Terminal World / Checkpoint · 커뮤니티로 사람을 모으기 전에, 혼자서도 끝나는 가치를 만듭니다.')+`<div class="grid two"><div><p class="concept-value">${esc(D.mvp.definition)}</p><p class="muted">${esc(D.mvp.audience)}</p></div><div class="note" style="margin:0"><strong style="color:var(--text)">정확히 무엇을 복원하나요?</strong><p style="margin:9px 0 0">${esc(D.mvp.promise)}</p></div></div><div class="flow-buttons" id="flow-buttons" aria-label="제안 사용 흐름"></div><div class="flow-result" id="flow-result" aria-live="polite"></div><p class="terminal-label">제안 UX 흐름 · 실제 파일을 저장하거나 명령을 실행하지 않습니다.</p><div class="grid two" style="margin-top:26px"><article class="card"><span class="eyebrow">MUST HAVE</span><h3 style="margin-top:12px">첫 가치를 완성하는 기능</h3>${list(D.mvp.must)}</article><article class="card"><span class="eyebrow" style="color:var(--orange)">REMOVE / DEFER</span><h3 style="margin-top:12px">의도적으로 줄이는 범위</h3>${list(D.mvp.remove)}</article></div>${detail('구조·기술 후보·보안 경계',`<h4>기술 스택 후보</h4><div class="grid three">${D.mvp.stack.map(s=>`<div class="mini-card"><h4>${esc(s.name)}</h4><p>${esc(s.reason)}</p><p>${esc(s.tradeoff)}</p></div>`).join('')}</div><h4 style="margin-top:24px">기술 구조와 시연 포인트</h4>${list(D.mvp.architecture)}<h4>보안·저장·운영</h4>${list(D.mvp.security)}<h4>검증 후 검토할 기능</h4>${list(D.mvp.later)}`,true)}`)+
section('roadmap',head(9,'MVP Roadmap','8주, 더 만드는 대신 확인할 것.','착수 시점을 W01로 둔 상대 일정입니다. 개발 계획과 아래 실험 목표는 아직 수행하지 않았습니다.')+`<div class="grid three">${D.roadmap.map(r=>`<article class="roadmap-card"><span class="eyebrow">${esc(r.weeks)}</span><h3>${esc(r.title)}</h3><p>${esc(r.goal)}</p><div class="small"><strong>산출물</strong><p>${esc(r.deliverable)}</p></div><div class="gate"><span class="muted">다음 단계 조건</span><br>${esc(r.gate)}</div></article>`).join('')}</div>${detail('첫 실험: 메모보다 실제로 나은가?',`<h4>검증 가설</h4>${list(D.experiments.hypotheses)}<h4>모집 방법</h4>${list(D.mvp.recruitment)}<h4>실험 절차</h4><ol>${D.experiments.protocol.map(p=>`<li>${esc(p)}</li>`).join('')}</ol><h4>사용자 인터뷰 질문</h4>${list(D.experiments.interviews)}`,true)}${detail('측정 지표와 개발 중단 기준',`<div class="grid two">${D.experiments.metrics.map(m=>`<article class="card"><h4>${esc(m.name)}</h4><p>${esc(m.definition)}</p><p><strong>사전 설계 문턱</strong><br>${esc(m.threshold)}</p></article>`).join('')}</div><h4 style="margin-top:24px">피벗하거나 멈춰야 할 때</h4>${list(D.experiments.stop)}<div class="note warm">${esc(D.experiments.limits)}</div>`,true)}`)+
section('verdict',head(10,'Final Verdict','Terminal World의 존재 이유를 바꾼다.','가상 공간을 더 채우기 전에, 사용자가 혼자 해결하는 한 가지 문제부터.')+`<div class="verdict-layout"><div><p class="eyebrow">ONE RECOMMENDATION</p><h3 class="verdict-headline">혼자여도 쓸모 있고,<br><em>다음 작업에<br>다시 필요한 도구.</em></h3><p class="muted">추천은 <strong style="color:var(--text)">Checkpoint</strong>입니다.<br>더 큰 약속보다, 더 작은 비교 실험에서 시작합니다.</p><div class="actions"><a href="#decision" class="button primary">내 가중치로 다시 판단하기 ↑</a><a href="research-report.md" download class="button">상세 보고서 ↓</a></div></div><div>${D.verdict.map(v=>`<div class="verdict-item"><h4>${esc(v.label)}</h4><p>${esc(v.text)}</p></div>`).join('')}</div></div>`)+
section('sources',head(11,'Sources & Evidence','결론보다, 근거를 남긴다.','공식 자료의 기능 설명, 개별 사용자 반응, 분석 가설을 구분했습니다. 외부 원문을 열 때만 인터넷이 필요합니다.')+`<div class="grid two">${D.evidence.map(e=>`<article class="card"><span class="eyebrow">EVIDENCE / LIMITS</span><h3 style="margin-top:14px">${esc(e.title)}</h3><p>${esc(e.claim)}</p>${detail('해석 한계와 원문',`<p>${esc(e.limit)}</p>${refs(e.refs)}`)}</article>`).join('')}</div>${detail('전체 28개 출처 · 조사 기준일 2026-10-29',`<p>${esc(D.meta.evidenceNote)}</p><ol class="source-list">${D.sources.map((s,i)=>`<li><span class="badge">${String(i+1).padStart(2,'0')} / ${esc(s.type)}</span><h4 style="margin-top:10px"><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ↗</a></h4><p>${esc(s.note)}</p></li>`).join('')}</ol>`,true)}`);
let competitorFilter='전체',ideaFilter='전체',selectedTarget=D.targets[0].id,selectedConcept=D.concepts[0].id;
const selectedIdeas=new Set();
let weights=D.criteria.map(c=>c.weight),toastTimer;
function toast(message){$('#toast').textContent=message;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2500)}
function renderCompetitors(){const categories=['전체',...new Set(D.competitors.map(c=>c.category))];$('#competitor-filters').innerHTML=categories.map(c=>`<button class="filter" type="button" data-category="${esc(c)}" aria-pressed="${competitorFilter===c}">${esc(c)}</button>`).join('');const shown=D.competitors.filter(c=>competitorFilter==='전체'||c.category===competitorFilter);$('#competitor-count').textContent=`${shown.length} / ${D.competitors.length}개 제품 · 기능은 확인 사실, 재방문·기회는 분석 가설`;
$('#competitor-grid').innerHTML=shown.map(c=>`<article class="card competitor"><div class="card-top"><span class="logo-letter" aria-hidden="true">${esc(c.name.slice(0,2))}</span><span class="badge">${esc(c.category)}</span></div><h3>${esc(c.name)}</h3><p class="tagline">${esc(c.tagline)}</p>${facts([['타깃',c.target],['확인한 핵심 기능',c.features]])}${detail('문제·강점·한계·공백',facts([['해결하는 문제',c.problem],['돌아올 이유 · 가설',c.return],['한계 · 분석 포함',c.limit],['Terminal World의 기회 · 가설',c.gap]])+refs(c.refs))}</article>`).join('');}
$('#competitor-filters').addEventListener('click',e=>{const b=e.target.closest('button[data-category]');if(!b)return;competitorFilter=b.dataset.category;renderCompetitors();$$('#competitor-filters button').find(x=>x.dataset.category===competitorFilter).focus({preventScroll:true})});
function renderTarget(id){selectedTarget=id;const t=D.targets.find(t=>t.id===id);$('#target-list').innerHTML=D.targets.map(t=>`<button type="button" class="target-button" data-target="${t.id}" aria-pressed="${t.id===id}" aria-controls="target-panel">${esc(t.name)}</button>`).join('');$('#target-panel').innerHTML=`<span class="badge b">${esc(t.priority)}</span><p class="quote">“${esc(t.jtbd)}”</p><div class="grid two">${facts([['주요 불편함',t.pain],['기존 해결 방식',t.current],['예상 사용 동기',t.motivation]])}${facts([['제품 기회',t.opportunity],['초기 사용자 확보',t.access],['판단 이유 · 가설',t.rationale]])}</div>`;}
$('#target-list').addEventListener('click',e=>{const b=e.target.closest('button[data-target]');if(!b)return;renderTarget(b.dataset.target);$(`#target-list [data-target="${selectedTarget}"]`).focus({preventScroll:true})});
const strategyNames={A:'기존 커뮤니티 강화',B:'Terminal-native 전환',C:'전면 재설계'};
function renderIdeas(){const filters=[['전체','전체 방향'],...Object.entries(strategyNames).map(([k,v])=>[k,`${k} · ${v}`])];$('#idea-filters').innerHTML=filters.map(([id,name])=>`<button class="filter" type="button" data-strategy="${id}" aria-pressed="${ideaFilter===id}">${esc(name)}</button>`).join('');const shown=D.ideas.filter(i=>ideaFilter==='전체'||i.strategy===ideaFilter);$('#idea-count').textContent=`${shown.length} / ${D.ideas.length}개 콘셉트 · 반복 가능성과 차별점은 검증 전 가설`;
$('#idea-grid').innerHTML=shown.map(i=>`<article class="card idea" data-idea="${i.id}"><div class="card-top"><span class="badge ${i.strategy.toLowerCase()}">${i.strategy} / ${strategyNames[i.strategy]}</span>${D.concepts.some(c=>c.id===i.id)?'<span class="badge b">TOP 3</span>':''}</div><h3>${esc(i.name)}</h3><p class="tagline">${esc(i.tagline)}</p>${facts([['사용자',i.target],['핵심 문제',i.problem]])}<div class="idea-meta">구현 난이도 · ${esc(i.difficulty)}<br>반복 계기 · ${esc(i.repeat)}</div>${detail('시나리오·장단점·선별 판단',facts([['핵심 시나리오',i.scenario],['대신 사용할 이유',i.reason],['경쟁 대비 차이',i.difference],['혼자일 때의 가치',i.coldStart],['가장 큰 실패 가능성',i.risk],['선별 판단',i.screening]])+`<h4 style="margin-top:14px">장점</h4>${list(i.advantages)}<h4>단점</h4>${list(i.disadvantages)}${refs(i.refs)}`)}<button class="button compare-toggle" type="button" data-compare="${i.id}" aria-pressed="${selectedIdeas.has(i.id)}" aria-label="${esc(i.name)} ${selectedIdeas.has(i.id)?'비교에서 제외':'비교에 추가'}">${selectedIdeas.has(i.id)?'✓ 비교 선택됨':'＋ 비교 후보에 담기'}</button></article>`).join('');}
function renderCompare(){const picked=D.ideas.filter(i=>selectedIdeas.has(i.id));$('#compare-count').textContent=`${picked.length} / 3`;$('#clear-compare').disabled=!picked.length;$('#compare-grid').className=picked.length?'grid three':'';$('#compare-grid').innerHTML=picked.length?picked.map(i=>`<article class="mini-card"><span class="eyebrow">STRATEGY ${i.strategy}</span><h4>${esc(i.name)}</h4><p class="small">${esc(i.tagline)}</p>${facts([['구현 난이도',i.difficulty],['혼자 사용',i.coldStart],['반복 계기',i.repeat],['주요 위험',i.risk]])}<button class="button" type="button" data-remove="${i.id}" aria-label="${esc(i.name)} 비교에서 제거">비교에서 제거 ×</button></article>`).join(''):'<p class="compare-empty">관심 있는 아이디어에서 ‘비교 후보에 담기’를 누르세요. 전략 필터를 바꿔도 선택은 유지됩니다.</p>';
$$('.compare-toggle').forEach(b=>{const on=selectedIdeas.has(b.dataset.compare),name=D.ideas.find(i=>i.id===b.dataset.compare).name;b.setAttribute('aria-pressed',String(on));b.textContent=on?'✓ 비교 선택됨':'＋ 비교 후보에 담기';b.setAttribute('aria-label',`${name} ${on?'비교에서 제외':'비교에 추가'}`)});}
$('#idea-filters').addEventListener('click',e=>{const b=e.target.closest('button[data-strategy]');if(!b)return;ideaFilter=b.dataset.strategy;renderIdeas();$$('#idea-filters button').find(x=>x.dataset.strategy===ideaFilter).focus({preventScroll:true})});
$('#idea-grid').addEventListener('click',e=>{const b=e.target.closest('[data-compare]');if(!b)return;const id=b.dataset.compare;if(selectedIdeas.has(id))selectedIdeas.delete(id);else if(selectedIdeas.size<3)selectedIdeas.add(id);else{toast('한 번에 3개까지 비교할 수 있습니다. 먼저 선택 하나를 해제하세요.');return}renderCompare();toast(`${selectedIdeas.size}개 후보를 비교하고 있습니다.`)});
$('#compare-grid').addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(!b)return;selectedIdeas.delete(b.dataset.remove);renderCompare();$('#clear-compare').disabled?$('#idea-compare h3').setAttribute('tabindex','-1'):null;const next=$('#compare-grid [data-remove]')||$('#idea-compare h3');next.focus({preventScroll:true});toast('비교 후보에서 제거했습니다.')});
$('#clear-compare').addEventListener('click',()=>{selectedIdeas.clear();renderCompare();$('#idea-compare h3').setAttribute('tabindex','-1');$('#idea-compare h3').focus({preventScroll:true});toast('비교 선택을 지웠습니다.')});
$('#concept-tabs').innerHTML=D.concepts.map(c=>`<button type="button" class="tab" role="tab" id="tab-${c.id}" aria-controls="concept-panel" aria-selected="false" tabindex="-1" data-concept="${c.id}">${esc(c.name)}</button>`).join('');
function renderConcept(id){selectedConcept=id;const c=D.concepts.find(c=>c.id===id),idea=D.ideas.find(i=>i.id===id);$$('#concept-tabs button').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.concept===id));b.tabIndex=b.dataset.concept===id?0:-1});$('#concept-panel').setAttribute('aria-labelledby',`tab-${id}`);$('#concept-panel').innerHTML=`<div class="concept-layout"><div><span class="badge ${idea.strategy.toLowerCase()}">STRATEGY ${idea.strategy} · ${id==='checkpoint'?'기본 추천':'심층 비교 후보'}</span><h3 class="concept-title">${esc(c.name)}</h3><p class="concept-value">${esc(c.value)}</p><p class="muted">${esc(c.vision)}</p>${facts([['페르소나',c.persona],['해결할 문제',c.problem]])}<h4 style="margin-top:22px">새로운 핵심 기능</h4>${list(c.functions)}</div><div><div class="terminal"><div class="terminal-header"><i></i><i></i><i></i><span style="margin-left:8px">${esc(c.name.toUpperCase())} / CONCEPT PREVIEW</span></div><pre>${esc(c.demo.join('\n'))}</pre></div><p class="terminal-label">제안 UX 예시 · 실행되는 앱 아님</p>${facts([['첫 사용',c.first],['일상적인 반복',c.daily],['경쟁 우위 가설',c.edge],['실패 위험',c.risk]])}</div></div>${detail('유지·변경·삭제, UX와 기술 구조',`<div class="grid three"><div><h4>유지</h4>${list(c.keep)}</div><div><h4>변경</h4>${list(c.change)}</div><div><h4>삭제</h4>${list(c.remove)}</div></div><h4>UX 구조</h4><p>${c.ux.map(esc).join(' → ')}</p><h4>기술 구현 방향</h4>${list(c.tech)}${refs(idea.refs)}`,true)}`;}
$('#concept-tabs').addEventListener('click',e=>{const b=e.target.closest('[data-concept]');if(b)renderConcept(b.dataset.concept)});
$('#concept-tabs').addEventListener('keydown',e=>{const tabs=$$('#concept-tabs button'),idx=tabs.indexOf(document.activeElement);if(idx<0)return;let n;if(e.key==='ArrowRight')n=(idx+1)%tabs.length;else if(e.key==='ArrowLeft')n=(idx-1+tabs.length)%tabs.length;else if(e.key==='Home')n=0;else if(e.key==='End')n=tabs.length-1;else return;e.preventDefault();renderConcept(tabs[n].dataset.concept);tabs[n].focus()});
$('#weights').innerHTML=D.criteria.map((c,i)=>`<div class="weight-control"><div class="weight-label"><label for="weight-${c.id}">${esc(c.label)}</label><output id="output-${c.id}" for="weight-${c.id}">${c.weight}</output></div><input id="weight-${c.id}" type="range" min="0" max="30" step="1" value="${c.weight}" data-weight="${i}" aria-describedby="hint-${c.id}"><div class="weight-hint" id="hint-${c.id}">${esc(c.description)}</div></div>`).join('');
function renderRanking(){const sum=weights.reduce((a,b)=>a+b,0);D.criteria.forEach((c,i)=>{$(`#output-${c.id}`).value=String(weights[i]);$(`#weight-${c.id}`).value=String(weights[i]);$(`#weight-${c.id}`).setAttribute('aria-valuetext',`${weights[i]}, 전체 가중치의 ${sum?Math.round(weights[i]/sum*100):0}%`)});$('#weight-summary').textContent=`가중치 합 ${sum} · ${sum?'합계에 맞춰 100점 만점으로 자동 정규화':'한 항목 이상을 1 이상으로 설정하세요'}`;
const scored=D.concepts.map(c=>({...c,total:sum?c.scores.reduce((a,s,i)=>a+s*weights[i],0)/(5*sum)*100:null})).sort((a,b)=>(b.total??0)-(a.total??0));const winners=sum?scored.filter(c=>Math.abs(c.total-scored[0].total)<1e-9):[];$('#mobile-scores').innerHTML=scored.map(c=>`<div class="${winners.some(w=>w.id===c.id)?'leading':''}">${esc(c.name)}<strong>${c.total===null?'—':c.total.toFixed(1)}</strong></div>`).join('');$('#ranking-status').textContent=sum?`현재 가중치 ${winners.length>1?'공동 1위':'1위'}: ${winners.map(c=>c.name).join(' · ')}`:'가중치 합이 0입니다. 현재 점수와 순위를 계산하지 않습니다.';
$('#ranking').innerHTML=scored.map(c=>`<article class="ranking-card ${winners.some(w=>w.id===c.id)?'winner':''}" data-score-id="${c.id}"><div class="ranking-heading"><div><h3>${esc(c.name)}</h3><span class="badge ${c.id==='checkpoint'?'b':''}">${c.id==='checkpoint'?'기본 전략 추천':'대안 후보'}${winners.some(w=>w.id===c.id)?' · 현재 '+(winners.length>1?'공동 1위':'1위'):''}</span></div><span class="score-number" data-total="${c.total??''}">${c.total===null?'—':c.total.toFixed(2)}<small>/100</small></span></div><div class="bar" aria-hidden="true"><i style="width:${c.total??0}%"></i></div><p>${esc(D.ideas.find(i=>i.id===c.id).advantages.join(' · '))}</p></article>`).join('');}
$('#weights').addEventListener('input',e=>{if(!e.target.matches('[data-weight]'))return;weights[Number(e.target.dataset.weight)]=Number(e.target.value);renderRanking()});
$('#reset-weights').addEventListener('click',()=>{weights=D.criteria.map(c=>c.weight);renderRanking();toast('기본 가중치로 되돌렸습니다.')});
function renderFlow(i){$('#flow-buttons').innerHTML=D.mvp.flow.map((f,n)=>`<button type="button" class="flow-button" data-flow="${n}" aria-pressed="${n===i}" aria-controls="flow-result"><span>STEP 0${n+1}</span>${esc(f.title)}</button>`).join('');$('#flow-result').innerHTML=`<h3>${esc(D.mvp.flow[i].title)}</h3><p>${esc(D.mvp.flow[i].text)}</p>`;}
$('#flow-buttons').addEventListener('click',e=>{const b=e.target.closest('[data-flow]');if(!b)return;const i=Number(b.dataset.flow);renderFlow(i);$(`#flow-buttons [data-flow="${i}"]`).focus({preventScroll:true})});
function syncTheme(){const light=document.documentElement.dataset.theme==='light';$('#theme-toggle').textContent=light?'☾ 다크':'☀ 라이트';$('#theme-toggle').setAttribute('aria-label',light?'다크모드로 전환':'라이트모드로 전환');$('#theme-toggle').setAttribute('aria-pressed',String(light))}
$('#theme-toggle').addEventListener('click',()=>{const t=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=t;try{localStorage.setItem('tw-strategy-theme',t)}catch(e){}syncTheme()});
function setMenu(open){$('#sidebar').classList.toggle('open',open);$('#menu-toggle').setAttribute('aria-expanded',String(open));$('#menu-toggle').setAttribute('aria-label',open?'메뉴 닫기':'메뉴 열기');$('#menu-toggle').textContent=open?'닫기':'메뉴'}
$('#menu-toggle').addEventListener('click',()=>{const open=!$('#sidebar').classList.contains('open');setMenu(open);if(open)$('#navigation a').focus()});
$('#navigation').addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;setMenu(false);const target=document.getElementById(a.hash.slice(1));if(target){target.setAttribute('tabindex','-1');target.focus({preventScroll:true})}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sidebar').classList.contains('open')){setMenu(false);$('#menu-toggle').focus()}});
let ticking=false;function progress(){const max=document.documentElement.scrollHeight-innerHeight;$('#progress').style.width=`${max>0?Math.max(0,Math.min(100,scrollY/max*100)):0}%`;const sections=$$('main section[id]');let active=sections[0]?.id;for(const s of sections)if(s.getBoundingClientRect().top<=155)active=s.id;$$('#navigation a').forEach(a=>{if(a.hash===`#${active}`)a.setAttribute('aria-current','true');else a.removeAttribute('aria-current')});ticking=false}
window.addEventListener('scroll',()=>{if(!ticking){requestAnimationFrame(progress);ticking=true}},{passive:true});window.addEventListener('resize',()=>{if(innerWidth>767)setMenu(false);progress()});
$$('main section[id]').forEach(s=>{const h=s.querySelector('h1,h2');if(h){h.id='heading-'+s.id;s.removeAttribute('aria-label');s.setAttribute('aria-labelledby',h.id)}});
renderCompetitors();renderTarget(selectedTarget);renderIdeas();renderCompare();renderConcept(selectedConcept);renderRanking();renderFlow(0);syncTheme();progress();
</script>
</body></html>
